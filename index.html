<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>EduQuest — Learn by adventure</title>
<meta name="description" content="EduQuest: a learning adventure for ages 6–9. Explore the map, take a quest, solve story challenges with Questy.">
<meta name="theme-color" content="#241A3F">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EduQuest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="stage">
    <div id="phone">
      <div id="screen"></div>
      <div id="statusbar"></div>
      <div id="toast"></div>
      <div id="homeind"></div>
    </div>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/components.js"></script>
  <script src="js/data.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/profiles.js"></script>
  <script src="js/screens-onboarding.js"></script>
  <script src="js/screens-world.js"></script>
  <script src="js/screens-play.js"></script>
  <script src="js/screens-collect.js"></script>
  <script src="js/parent.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => { /* offline install unavailable */ });
      });
    }
    // installed-app mode: the OS draws its own status bar, so hide the in-canvas one on touch devices
    if ((window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true)
        && window.matchMedia('(pointer: coarse)').matches) {
      document.body.classList.add('standalone-touch');
    }
  </script>
</body>
</html>
